<style>
	body {
		min-height: 200px
	}
</style>
<img src="./cat.png" id="cat" style="position: absolute">
<img src="./hat.png" id="hat" style="position: absolute">

<script>
	let cat = document.querySelector("#cat")
	let hat = document.querySelector("#hat")

	let angle = 0
	let last_time = null
	function animate(time) {
		if (last_time != null)
			angle += (time - last_time) * 0.001
		last_time = time
		cat.style.top = (Math.sin(angle) * 40 + 40) + "px"
		cat.style.left = (Math.cos(angle) * 200 + 230) + "px"

		hat.style.top = (Math.sin(Math.PI + angle) * 40 + 40) + "px"
		hat.style.left = (Math.cos(Math.PI + angle) * 200 + 230) + "px"

		requestAnimationFrame(animate)
	}
	requestAnimationFrame(animate)
</script>
