<!DOCTYPE html>
<html>

<head>
	<title>Mouse trail</title>
</head>

<body>
	<style>
		.trail {
			position: absolute;
			height: 6px;
			width: 6px;
			border-radius: 3px;
			background: teal;
		}

		body {
			height: 300px;
		}
	</style>

	<script>
		const trails = []
		const trails_number = 100

		// Create dots
		for (let i = 0; i < trails_number; i++) {
			let trail = document.createElement("div")
			trail.className = "trail"
			trails.push(trail)
			document.body.appendChild(trail)
		}

		let current = 0
	/*
		window.addEventListener("mousemove", event => {
			const current_trail = trails[current % trails_number]
			current_trail.style.left = (event.pageX - 3) + "px"
			current_trail.style.top = (event.pageY - 3) + "px"
			current++
		}) */
		// Mouse position (page coordinates)
		let mouse_x = window.innerWidth / 2
		let mouse_y = window.innerHeight / 2

		const offset_xs = []
		const xs = []
		const vxs = []

		const offset_ys = []
		const ys = []
		const vys = []

		// Initialize state
		for (let i = 0; i < trails_number; i++) {
			xs.push(mouse_x)
			vxs.push(0)

			ys.push(mouse_y)
			vys.push(0)

			// Random offset in a small radius
			const angle = Math.random() * Math.PI * 2
			const radius = Math.random() * 40
			offset_xs.push(Math.cos(angle) * radius)
			offset_ys.push(Math.sin(angle) * radius)
		}

		window.addEventListener("mousemove", event => {
			mouse_x = event.pageX
			mouse_y = event.pageY
		})

		function step() {
			// Tune these two numbers to change the feel
			const spring = 0.02 // attraction strength
			const damping = 0.85 // lower = more friction

			for (let i = 0; i < trails_number; i++) {
				const target_x = mouse_x + offset_xs[i]
				const target_y = mouse_y + offset_ys[i]

				const dx = target_x - xs[i]
				const dy = target_y - ys[i]

				vxs[i] = (vxs[i] + dx * spring) * damping
				vys[i] = (vys[i] + dy * spring) * damping

				xs[i] += vxs[i]
				ys[i] += vys[i]

				trails[i].style.left = xs[i] + "px"
				trails[i].style.top = ys[i] + "px"
			}

			requestAnimationFrame(step)
		}

		requestAnimationFrame(step)
	</script>
</body>

</html>
